# The trigger task 11.64 asked task 11.40 to choose.
#
# ## What this runs, and why it is not in the other workflow
#
# `scripts/verify_round8_broken_control.py` breaks the server on purpose —
# twice, in different places — and requires
# `verify_round8_server_surface.py` to notice. **It is the only thing proving
# the 152 gate checks that instrument makes can fail at all.** A run in which
# every attack is refused is exactly what a blind instrument produces, and this
# project has shipped three of those.
#
# It takes roughly ten minutes, because each variant is a fresh
# `dart compile exe`. Task 11.64 deliberately kept it **out** of
# `gate_smoke_test.sh`: a ten-minute build inside a three-minute run would stop
# the run being used, and a check nobody runs is the shape that has lost this
# project instruments three times. So it needed a trigger rather than a
# schedule, and this is it.
#
# ## Why paths, and not a schedule or a person
#
# The rule 11.64 wrote is "re-run it after touching the sync envelope or the
# auth routes." That is a trigger with a *condition*, and a condition a person
# has to remember is the thing this whole task exists to replace. A nightly
# schedule would be worse in both directions: ten minutes of building every
# night when nothing changed, and still nothing on the afternoon somebody edits
# the envelope.
#
# **The paths below are the three files the script itself patches**, read out
# of `verify_round8_broken_control.py` rather than chosen — `AUTH_ROUTES`,
# `EMAIL_SENDER`, `SYNC_PROTOCOL` — plus the two instruments involved. If the
# script learns a fourth variant, this list is wrong, and
# `test/documentation/broken_control_trigger_test.dart` fails until it is
# fixed. That guard exists because a hand-written list of paths is exactly the
# hand-maintained list one layer up that task 11.49 found three times.
name: Broken-control check

# PAUSED 2026-10-02 (task 11.325): this workflow now starts only when somebody presses
