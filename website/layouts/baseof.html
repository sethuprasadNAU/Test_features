<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
{{ with .Description }}<meta name="description" content="{{ . }}">{{ end }}
<link rel="stylesheet" href="{{ "style.css" | relURL }}">
</head>
<body>
<header class="site">
  <a class="brand" href="{{ .Site.Home.RelPermalink }}">TriTrack</a>
  <nav>
    {{ range .Site.Menus.main }}<a href="{{ .URL }}">{{ .Name }}</a>{{ end }}
  </nav>
</header>
<main>
{{ block "main" . }}{{ end }}
</main>
<footer class="site">
  <p>TriTrack — radio-telemetry field data collection.</p>
</footer>
</body>
</html>
